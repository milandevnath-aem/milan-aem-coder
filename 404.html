<!DOCTYPE html>
<html lang="en">

<head>
  <meta
    http-equiv="Content-Security-Policy"
    content="script-src 'nonce-aem' 'strict-dynamic' 'unsafe-inline' http: https:; base-uri 'self'; object-src 'none';"
    move-to-http-header="true"
  >
  <title>Page not found | Kotak Prime</title>
  <script nonce="aem" type="text/javascript">
    window.isErrorPage = true;
    window.errorCode = '404';
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta property="og:title" content="Page not found">
  <script nonce="aem" src="/scripts/scripts.js" type="module"></script>
  <script nonce="aem" type="module">
    // "Go to home" follows the header logo's link (the site's home page, e.g. /home);
    // /home stays when the header has none
    const home = document.querySelector('.error-button-home');
    const setHome = () => {
      const link = document.querySelector('header .nav-brand a[href]');
      if (link) home.href = link.href;
      return Boolean(link);
    };
    const header = document.querySelector('header');
    if (home && header && !setHome()) {
      new MutationObserver((_, observer) => {
        if (setHome()) observer.disconnect();
      }).observe(header, { childList: true, subtree: true });
    }
  </script>
  <script nonce="aem" type="module">
    import { sampleRUM } from '/scripts/aem.js';
    sampleRUM('404', { source: document.referrer });
  </script>
  <link rel="stylesheet" href="/styles/variables/base.css">
  <link rel="stylesheet" href="/styles/styles.css">
  <style>
    main.error {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - var(--nav-height));
    }

    main.error .section {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px;
      text-align: center;
    }

    /* the 404 graphic (/icons/404.svg, 71 x 67); its alt text "404" is the heading */
    main.error .error-number {
      margin: 0;
      line-height: 0;
    }

    /* centred on its own: the content sits in the section's default content wrapper */
    main.error .error-graphic {
      display: block;
      margin: 0 auto;
    }

    /* Figma Web Breakpoint/Body/B2: 16/24, 500, #666 */
    main.error .error-message {
      margin: 8px 0 0;
      color: var(--muted-color);
      font-size: var(--body-font-size-m);
      font-weight: 500;
      line-height: 24px;
      letter-spacing: 0;
    }

    main.error .button-container {
      margin: 24px 0 0;
    }

    /* Figma pill button: 14px 24px padding (1px of it is the border), BT-3 16/24, 600 */
    main.error .error-button-home {
      padding: 13px 23px;
      font-size: var(--body-font-size-m);
      font-weight: 600;
      line-height: 24px;
    }
  </style>
  <link rel="stylesheet" href="/styles/lazy-styles.css">
</head>

<body>
  <header></header>
  <main class="error">
    <div class="section">
      <h1 class="error-number">
        <img class="error-graphic" src="/icons/404.svg" alt="404" width="71" height="67">
      </h1>
      <p class="error-message">Oops! Page not found.</p>
      <p class="button-container">
        <a href="/home" class="button primary error-button-home">Go to home</a>
      </p>
    </div>
  </main>
  <footer></footer>
</body>

</html>
